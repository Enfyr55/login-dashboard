<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Login Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body
        {
            font-family: "Segoe UI", Arial;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 40px;
        }

        h1
        {
            margin-bottom: 30px;
        }

        .card
        {
            background: #1e293b;
            padding: 30px;
            border-radius: 14px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .title
        {
            font-size: 13px;
            color: #94a3b8;
        }

        .value
        {
            font-size: 28px;
            margin-top: 10px;
            font-weight: 600;
        }

        .status
        {
            margin-top: 20px;
            font-size: 15px;
            font-weight: 500;
        }

        .green { color: #22c55e; }
        .yellow { color: #facc15; }
        .red { color: #ef4444; }

        .footer
        {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>

<body>

<h1>🔍 Login Monitor</h1>

<div class="card">

    <div class="title">Last login</div>
    <div id="lastLogin" class="value">Laster...</div>

    <div id="statusText" class="status">Sjekker...</div>

</div>

<div class="footer" id="lastUpdated">
    Oppdaterer...
</div>

<script>
    const supabaseUrl = "https://nyhtzyydxmhfnptabvsm.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55aHR6eXlkeG1oZm5wdGFidnNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYyOTg1MzgsImV4cCI6MjA3MTg3NDUzOH0.wandkCM1cj_AEfIq4Mh75vuxv5EYUdWn1fObEoHW3Fc";

    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

    function formatDate(dateString)
    {
        const d = new Date(dateString);
        return d.toLocaleString("no-NO");
    }

    function updateStatus(lastLogin)
    {
        const diff = Date.now() - new Date(lastLogin);
        const status = document.getElementById("statusText");

        if (diff < 5 * 60 * 1000)
        {
            status.innerText = "🟢 Nylig aktivitet";
            status.className = "status green";
        }
        else if (diff < 60 * 60 * 1000)
        {
            status.innerText = "🟡 Ingen ny aktivitet nylig";
            status.className = "status yellow";
        }
        else
        {
            status.innerText = "🔴 Inaktiv";
            status.className = "status red";
        }
    }

    async function loadData()
    {
        const { data, error } = await supabase
            .from("login_events")
            .select("*")
            .order("last_login", { ascending: false })
            .limit(1);

        if (error)
        {
            console.error(error);
            return;
        }

        if (data.length > 0)
        {
            const row = data[0];

            document.getElementById("lastLogin").innerText =
                formatDate(row.last_login);

            updateStatus(row.last_login);

            document.getElementById("lastUpdated").innerText =
                "Oppdatert: " + new Date().toLocaleTimeString("no-NO");
        }
    }

    loadData();
    setInterval(loadData, 30000);
</script>

</body>
</html>
