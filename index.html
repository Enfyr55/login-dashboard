<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Login Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body
        {
            font-family: "Segoe UI", Arial;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: flex-start;

            padding-top: 80px;
        }

        .wrapper
        {
            text-align: center;
        }

        h1
        {
            margin-bottom: 10px;
        }

        .card
        {
            background: #1e293b;
            padding: 30px;
            border-radius: 14px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);

            margin-top: 20px;

            max-height: 80vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .title
        {
            font-size: 13px;
            color: #94a3b8;
        }

        .value
        {
            font-size: 28px;
            margin-top: 10px;
            font-weight: 600;
            color: #60a5fa;
        }

        .history
        {
            margin-top: 20px;
            text-align: left;

            flex: 1;
            overflow-y: auto;

            border-top: 1px solid #334155;
            padding-top: 10px;
        }

        .row
        {
            font-size: 12px;
            padding: 6px 0;
            border-bottom: 1px solid #1e293b;
            padding-left: 20px;
        }

        .row:hover
        {
            background: rgba(255,255,255,0.03);
            border-radius: 6px;
        }

        .week
        {
            position: sticky;
            top: 0;
            background: #1e293b;
            padding: 6px 0;
            z-index: 2;
            font-weight: 600;
            color: #93c5fd;
            margin-top: 10px;
        }

        .day
        {
            position: sticky;
            top: 28px;
            background: #1e293b;
            z-index: 1;
            padding-left: 10px;
            font-weight: 500;
            color: #cbd5f5;
            margin-top: 6px;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <h1>🔍 Login Monitor</h1>

    <div class="card">

        <div class="title">Siste login</div>
        <div id="lastLogin" class="value">Laster...</div>

        <div class="history" id="historyList"></div>

    </div>

</div>

<script>
    const supabaseUrl = "https://nyhtzyydxmhfnptabvsm.supabase.co";

    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55aHR6eXlkeG1oZm5wdGFidnNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYyOTg1MzgsImV4cCI6MjA3MTg3NDUzOH0.wandkCM1cj_AEfIq4Mh75vuxv5EYUdWn1fObEoHW3Fc";

    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    function formatDate(dateString)
    {
        if (!dateString)
        {
            return "Ingen data";
        }

        const fixed = dateString.replace(" ", "T");
        const d = new Date(fixed);

        if (isNaN(d))
        {
            return "Ugyldig dato";
        }

        return d.toLocaleString("no-NO");
    }

    function renderHistory(data)
    {
        const container = document.getElementById("historyList");
        container.innerHTML = "";

        let currentWeek = null;
        let currentDay = null;

        data.forEach(row =>
        {
            const fixed = row.last_login.replace(" ", "T");
            const date = new Date(fixed);

            const week = getWeekNumber(date);
            const dayKey = date.toDateString();

            // Uke
            if (week !== currentWeek)
            {
                currentWeek = week;
                currentDay = null;

                const weekDiv = document.createElement("div");
                weekDiv.className = "week";
                weekDiv.innerText = "Uke " + week;

                container.appendChild(weekDiv);
            }

            // Dag
            if (dayKey !== currentDay)
            {
                currentDay = dayKey;

                const dayDiv = document.createElement("div");
                dayDiv.className = "day";

                const dayName = capitalize(
                    date.toLocaleDateString("no-NO", { weekday: "long" })
                );

                const dateStr = date.toLocaleDateString("no-NO");

                dayDiv.innerText = `${dayName} ${dateStr}`;

                container.appendChild(dayDiv);
            }

            // Tid
            const timeDiv = document.createElement("div");
            timeDiv.className = "row";

            const time = date.toLocaleTimeString("no-NO");

            timeDiv.innerText = "• " + time;

            container.appendChild(timeDiv);
        });
    }

    async function loadData()
    {
        try
        {
            const { data, error } = await supabaseClient
                .from("login_events")
                .select("*")
                .order("last_login", { ascending: false });

            if (error)
            {
                document.getElementById("lastLogin").innerText = "Feil ved henting";
                console.error(error);
                return;
            }

            if (!data || data.length === 0)
            {
                document.getElementById("lastLogin").innerText = "Ingen data";
                return;
            }

            const latest = data[0];

            document.getElementById("lastLogin").innerText =
                formatDate(latest.last_login);

            renderHistory(data);
        }
        catch (err)
        {
            console.error("CRASH:", err);
            document.getElementById("lastLogin").innerText = "Script-feil";
        }
    }

    function getWeekNumber(date)
    {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    function capitalize(str)
    {
        return str.charAt(0).toUpperCase() + str.slice(1);
    }

    loadData();
    setInterval(loadData, 30000);
</script>

</body>
</html>
