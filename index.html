<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Login Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body
		{
			font-family: "Segoe UI", Arial;
			background: #0f172a;
			color: #e2e8f0;
			margin: 0;

			display: flex;
			justify-content: center;
			align-items: flex-start;

			padding-top: 80px;
		}

        .wrapper
        {
            text-align: center;
        }

        h1
        {
            margin-bottom: 10px;
        }

        .card
        {
            background: #1e293b;
            padding: 30px;
            border-radius: 14px;
            width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);

            margin-top: 20px;
        }

        .title
        {
            font-size: 13px;
            color: #94a3b8;
        }

        .value
        {
            font-size: 28px;
            margin-top: 10px;
            font-weight: 600;
        }

        .history
        {
            margin-top: 20px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }

        .row
        {
            font-size: 13px;
            padding: 6px 0;
            border-bottom: 1px solid #1e293b;
        }
    </style>
</head>

<body>

<div class="wrapper">

    <h1>🔍 Login Monitor</h1>

    <div class="card">

        <div class="title">Siste login</div>
        <div id="lastLogin" class="value">Laster...</div>

        <div class="history" id="historyList"></div>

    </div>

</div>

<script>
    const supabaseUrl = "https://nyhtzyydxmhfnptabvsm.supabase.co";

    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im55aHR6eXlkeG1oZm5wdGFidnNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTYyOTg1MzgsImV4cCI6MjA3MTg3NDUzOH0.wandkCM1cj_AEfIq4Mh75vuxv5EYUdWn1fObEoHW3Fc";

    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

    function formatDate(dateString)
    {
        if (!dateString)
        {
            return "Ingen data";
        }

        const fixed = dateString.replace(" ", "T");
        const d = new Date(fixed);

        if (isNaN(d))
        {
            return "Ugyldig dato";
        }

        return d.toLocaleString("no-NO");
    }

    function renderHistory(data)
    {
        const container = document.getElementById("historyList");
        container.innerHTML = "";

        data.forEach(row =>
        {
            const div = document.createElement("div");
            div.className = "row";
            div.innerText = formatDate(row.last_login);
            container.appendChild(div);
        });
    }

    async function loadData()
    {
        try
        {
            const { data, error } = await supabaseClient
                .from("login_events")
                .select("*")
                .order("last_login", { ascending: false });

            if (error)
            {
                document.getElementById("lastLogin").innerText = "Feil ved henting";
                console.error(error);
                return;
            }

            if (!data || data.length === 0)
            {
                document.getElementById("lastLogin").innerText = "Ingen data";
                return;
            }

            const latest = data[0];

            document.getElementById("lastLogin").innerText =
                formatDate(latest.last_login);

            renderHistory(data);
        }
        catch (err)
        {
            console.error("CRASH:", err);
            document.getElementById("lastLogin").innerText = "Script-feil";
        }
    }

    loadData();
    setInterval(loadData, 30000);
</script>

</body>
</html>
